name: Release

# Runs after a pull request lands on the default branch.
#
# This workflow ships; it does not re-test. Lint, specs, SAST, the image scan, the
# boot check, the posting smoke test and the DAST scan all ran on the pull request
# against this same code, and running them again here would spend the same minutes
# to reach the same answer.
#
# The only build of the merged code happens here, and the release is published
# strictly after that image is in the registry — never alongside it.
on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      version:
        description: >
          Override the computed version (e.g. "0.8.0"). When set, the version
          script is skipped and this value is used directly. Use this to re-cut
          a release that the automated pipeline mis-versioned.
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
      bump: ${{ steps.next.outputs.bump }}
      released: ${{ steps.next.outputs.version != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the range since the last tag can be walked.
          fetch-depth: 0
          # Pin to the commit that triggered this run, not the branch tip.
          # Without this, a second push to main between trigger and checkout
          # causes the version script to analyze commits it did not trigger
          # for, and the tag lands on the wrong commit.
          ref: ${{ github.sha }}

      # The derivation lives in .github/scripts/next-version.sh, with tests
      # beside it, because this logic has shipped a wrong tag twice — v0.0.1
      # instead of v0.1.0, and v1.0.0 instead of v0.2.0. Inline in YAML it could
      # not be run or tested without pushing.
      - name: Determine next version
        id: next
        env:
          VERSION_OVERRIDE: ${{ inputs.version }}
        run: |
          if [ -n "$VERSION_OVERRIDE" ]; then
            echo "bump=manual" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION_OVERRIDE}" >> "$GITHUB_OUTPUT"
          else
            .github/scripts/next-version.sh >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Publish release
    # Deliberately after the image, not beside it. When these ran in parallel the
    # tag and GitHub release appeared while the build was still going, so a pull
    # of the freshly announced version returned "not found" for several minutes —
    # and a failed build would have left a release pointing at nothing.
    needs: [ version, image ]
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      # Creates the tag at this commit as well as the release, so nothing needs
      # to push a tag separately.
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.version.outputs.version }}
          name: v${{ needs.version.outputs.version }}
          generate_release_notes: true
          target_commitish: ${{ github.sha }}

  image:
    name: Build and publish image
    needs: version
    if: needs.version.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Publishing to GHCR. The built-in GITHUB_TOKEN is enough — no secret to
      # create, no registry to provision.
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      # arm64 is built under emulation, since GitHub's standard runners are x86.
      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      # GHCR rejects upper-case characters in an image name, and the owner here
      # is mixed case, so it cannot be interpolated directly.
      - name: Compute image name
        id: image
        run: |
          owner=$(printf '%s' "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/twitter-clone-web" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ---------------------------------------------------------------------
      # Amazon ECR — not yet. GHCR above is the registry while the app has
      # nowhere to deploy to; ECR arrives with the AWS work, at which point the
      # image can go to both.
      #
      # Required before enabling:
      #   - An ECR repository for the app.
      #   - An IAM role trusting this repository through GitHub's OIDC provider.
      #   - Repository variables AWS_REGION, AWS_ACCOUNT_ID and ECR_REPOSITORY.
      #   - id-token: write added to this job's permissions, for OIDC.
      #
      # - name: Configure AWS credentials
      #   uses: aws-actions/configure-aws-credentials@v4
      #   with:
      #     role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/github-actions-ecr-push
      #     aws-region: ${{ vars.AWS_REGION }}
      #
      # - name: Log in to Amazon ECR
      #   id: ecr
      #   uses: aws-actions/amazon-ecr-login@v2
      #
      # Then add these to the tag list below:
      #   ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ needs.version.outputs.version }}
      #   ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:sha-${{ github.sha }}
      #   ${{ steps.ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:latest
      # ---------------------------------------------------------------------

      # Three tags: the semantic version, an immutable sha- tag so a deployment
      # can be pinned to an exact build, and latest.
      #
      # Built for both architectures and published as a manifest list, so the
      # right variant is selected on pull. amd64 alone fails outright on an Apple
      # Silicon machine ("no matching manifest for linux/arm64"), and arm64 is
      # also what AWS Graviton instances want, so this is not only a local
      # convenience.
      #
      # The arm64 half runs under QEMU and is markedly slower than the native
      # build — the gem compilation dominates. If that becomes painful, the fix
      # is a native arm64 runner rather than dropping the platform.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.version.outputs.version }}
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
            ${{ steps.image.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Same reasoning as ci.yml: the `base` stage is where `apt-get
          # upgrade` pulls operating system security fixes, and a cached copy
          # upgrades against stale package lists. It matters more here — this
          # is the image that actually gets published and pulled.
          no-cache-filters: base
          pull: true

      - name: Report what was published
        run: |
          echo "Version:  ${{ needs.version.outputs.version }}"
          echo "Image:    ${{ steps.image.outputs.name }}"
          echo "Tags:     ${{ needs.version.outputs.version }}, sha-${{ github.sha }}, latest"
          echo "Platforms: linux/amd64, linux/arm64"
          echo "Registry: ghcr.io. ECR is commented out in this workflow until AWS exists."
