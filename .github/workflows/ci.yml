name: CI

# One pipeline, because this repository holds one kind of thing.
#
# There was briefly a parent pipeline routing to child pipelines by changed
# path, because application and infrastructure code lived side by side and a
# Terraform change had no business running RSpec. Splitting the infrastructure
# into its own repository removed the decision rather than automating it, and
# with it the router, the aggregate gate that avoided required-check deadlock,
# and the test suite for the router itself.
#
# Paths, so a documentation-only change does not build and scan a container to
# learn nothing. Note this is `paths` on the trigger rather than an `if` on each
# job: nothing is skipped-but-visible, but it also means these checks do not
# exist at all on a docs-only pull request — see docs/ci-cd.md before adding
# any of them to a required-checks list.
on:
  pull_request:
    paths:
      - "web/**"
      - ".github/**"
      - "sonar-project.properties"

  # Merges too, for SonarQube's sake. A pull request analysis is measured
  # against the main branch's, so if main is never analysed there is nothing to
  # measure against and the dashboard freezes at whatever ran last. This used
  # to be covered by SonarQube Cloud's Automatic Analysis, which is now off
  # because it cannot coexist with a CI scan — see docs/ci-cd.md.
  push:
    branches:
      - main
    paths:
      - "web/**"
      - ".github/**"
      - "sonar-project.properties"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Catches what a YAML parser cannot: expression injection, invalid `needs:`
  # references, deprecated syntax. It also runs shellcheck over every `run:`
  # block, so the bash in these workflows is linted rather than read by eye —
  # which is how it found an unquoted command substitution feeding a secret
  # into the container job.
  #
  # next-version.sh is tested here too. Its suite existed and had never run in
  # CI: the script that derives every release version was guarded only by
  # someone remembering to run it, and it has shipped a wrong tag twice.
  tooling:
    name: Workflow lint and release tooling
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: actionlint
        uses: raven-actions/actionlint@v2
        with:
          shellcheck: true

      - name: Version derivation
        run: .github/scripts/test-next-version.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: web
          bundler-cache: true

      - name: RuboCop
        working-directory: web
        run: bundle exec rubocop --parallel

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          working-directory: web
          bundler-cache: true

      # The suite runs on SQLite, matching development. No services required.
      - name: RSpec
        working-directory: web
        env:
          RAILS_ENV: test
        run: bundle exec rspec --format documentation

      # Consumed by the SonarQube job. Uploaded even when the suite fails, so
      # a red run still reports the coverage it managed to record.
      - name: Upload the coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: web/coverage/coverage.json
          if-no-files-found: error
          retention-days: 7

  container:
    name: Container build, image scan and DAST
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Pull requests only. On a merge, release.yml builds and publishes this
    # image anyway, so running the five-minute build, scan and DAST here as
    # well would spend it twice on the same commit. The merge still runs the
    # cheap jobs, and SonarQube, which is what the push trigger is for.
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Built once and reused by the scan and the DAST run below, so the image
      # that gets scanned is the image that gets exercised.
      #
      # Single-architecture on purpose, unlike the release build. This image is
      # only ever scanned and booted on this runner, `load: true` cannot take a
      # multi-platform manifest list anyway, and building arm64 under QEMU would
      # add minutes to every pull request for no extra signal. The Dockerfile is
      # shared, so a genuinely architecture-specific break would still surface in
      # the release build.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: web
          load: true
          push: false
          tags: twitter-clone-web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # The `base` stage runs `apt-get upgrade`, which is where operating
          # system security fixes enter the image. Served from the build cache
          # it upgrades against whatever package lists that cached layer was
          # built with, so a fix published afterwards is never installed and the
          # scan below fails on a CVE the Dockerfile already believes it has
          # patched. Excluding just this stage keeps the fix current while every
          # other layer — bundle install, asset precompile — still caches.
          no-cache-filters: base
          # Refresh the base image too: a rebuilt ruby:slim carries fixes that
          # no amount of apt-get in our own layers can supply.
          pull: true

      # HIGH and CRITICAL fail; MEDIUM and LOW are reported without blocking. A
      # failure here is usually inherited from the base image rather than
      # written here, but inherited is not the same as acceptable — the fix is
      # to bump the base image or patch the package.
      #
      # ignore-unfixed keeps this achievable: only findings with a fix available
      # count. One with no upstream patch cannot be actioned by any change in
      # this repository, so failing on it would teach everyone to ignore the
      # gate.
      #
      # The ignore file lives at .github/trivyignore rather than the repository
      # root on purpose: Trivy auto-loads a root .trivyignore into *every* scan,
      # which would silently filter the SARIF report below as well. Naming it
      # explicitly here suppresses the gate only — a suppressed finding still
      # reaches code scanning. Suppressed from blocking, not from view.
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: twitter-clone-web:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .github/trivyignore
          exit-code: "1"

      # A suppression is a debt, not a decision, and nothing here would ever
      # have told us the debt could be paid. This re-runs the same scan with no
      # ignore file and fails when a suppressed finding has stopped appearing —
      # meaning the upstream fix landed and both the entry and the pin above it
      # should go. It fails on good news deliberately: a warning gets scrolled
      # past, and the remedy is deleting two lines.
      - name: Trivy image scan (unsuppressed, to detect stale entries)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: twitter-clone-web:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: json
          output: trivy-unsuppressed.json
          exit-code: "0"

      - name: Fail when a suppressed finding has been fixed upstream
        run: |
          set -euo pipefail
          present=$(jq -r '[.Results[]?.Vulnerabilities[]?.VulnerabilityID] | unique | .[]' trivy-unsuppressed.json)
          stale=""
          while read -r cve; do
            printf '%s\n' "$present" | grep -qx "$cve" || stale="${stale}${cve} "
          done < <(grep -oE '^CVE-[0-9]+-[0-9]+' .github/trivyignore)

          if [ -n "$stale" ]; then
            echo "::error::Fixed upstream — these suppressions are now stale: ${stale}"
            echo "The finding no longer appears, so the exception is no longer earning its place."
            echo "Remove those lines from .github/trivyignore, and bump the dependency they name."
            echo "If the file ends up empty, delete it and the trivyignores: line in this workflow."
            exit 1
          fi
          echo "Every suppressed finding is still present. The exception still earns its place."

      - name: Trivy image scan (report all severities)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: twitter-clone-web:${{ github.sha }}
          format: sarif
          output: trivy-image.sarif
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload image scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      # The command substitution is quoted (SC2046). `openssl rand -hex` emits
      # no whitespace, so nothing splits today — but an unquoted substitution
      # feeding a secret into a container is a habit worth not having.
      - name: Start the container
        run: |
          docker run -d --name web -p 3000:80 \
            -e RAILS_ENV=production \
            -e SECRET_KEY_BASE="$(openssl rand -hex 64)" \
            -e RAILS_LOG_TO_STDOUT=1 \
            twitter-clone-web:${{ github.sha }}

      # Proves the image actually boots and serves, not just that it builds.
      - name: Wait for the app to answer
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://localhost:3000/up > /dev/null; then
              echo "App is up after ${attempt}s"
              curl -fsS http://localhost:3000/ | grep -q "Feed" && echo "Feed renders"
              exit 0
            fi
            sleep 1
          done
          echo "App did not become healthy in time"
          docker logs web
          exit 1

      # Posting is the one thing the app does, so CI has to actually do it.
      #
      # Polling /up and rendering the feed are both GETs, and every way this has
      # broken so far has broken writes while leaving reads healthy — a CSRF
      # origin mismatch under assume_ssl returns 422 on POST and nothing at all
      # on GET. A green pipeline meant nothing here until this step existed.
      #
      # The checks live in web/script/smoke-test rather than inline here, so the
      # same script runs against a local server. A failure in CI is reproducible
      # with one command instead of by pushing again.
      - name: Smoke test registering and posting
        run: web/script/smoke-test http://localhost:3000

      # DAST: an unauthenticated baseline crawl of the running container.
      #
      # fail_action is false for now — a baseline scan of a fresh Rails app
      # reports header-level warnings (CSP, permissions policy) that are real but
      # out of scope for this milestone. Triage them, then flip this to true so
      # regressions fail the build.
      - name: OWASP ZAP baseline scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: http://localhost:3000
          fail_action: false
          allow_issue_writing: false
          cmd_options: "-a"

      # Guarded because these run even when an earlier step failed before the
      # container was ever created, and "No such container" should not add a
      # second, misleading failure on top of the real one.
      - name: Container logs
        if: always()
        run: docker logs web || echo "No container to log."

      - name: Stop the container
        if: always()
        run: docker rm -f web || true

  # Needs the suite's coverage, so it waits for it. The coverage report is
  # produced in the Test job and passed here as an artifact rather than by
  # re-running RSpec: one suite run, two consumers.
  sonarqube:
    name: SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          # Sonar needs full history to attribute issues to the commit that
          # introduced them.
          fetch-depth: 0

      # SimpleCov records absolute paths, and every job in a workflow checks
      # out to the same /home/runner/work/<repo>/<repo>, so the paths written
      # by the Test job resolve here. Restoring it anywhere else would leave
      # Sonar unable to match coverage to files.
      - name: Download the coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage
          path: web/coverage

      # No credential guard here, deliberately. This job used to skip itself
      # when SONAR_TOKEN was absent, which is why the project went unscanned
      # for weeks behind a green check: a scan that quietly does nothing is
      # indistinguishable from one that passed. A missing token now fails.
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          # SonarQube Cloud. Not a secret — it is the same public endpoint for
          # every project, and keeping it in a secret is how it ended up unset.
          SONAR_HOST_URL: https://sonarcloud.io
