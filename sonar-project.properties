# SonarQube Cloud project configuration.
#
# The scan runs in the sonarqube job of .github/workflows/ci.yml against
# https://sonarcloud.io, authenticated by the SONAR_TOKEN repository secret.
#
# The organization and project keys are assigned by SonarQube Cloud when the
# repository is imported — they are not free-form. They were wrong here until
# 2026-08-19 (a hand-written `jdsg-group6-twitter-clone` and no organization at
# all), which would have failed every scan had one ever run. Read them back
# from the API rather than retyping them:
#
#   curl -s "https://sonarcloud.io/api/components/show?component=GauranshMathur_JDSG-Group6-app"

sonar.organization=gauranshmathur
sonar.projectKey=GauranshMathur_JDSG-Group6-app
sonar.projectName=JDSG-Group6 Twitter Clone

sonar.sources=web/app,web/lib,web/config
sonar.tests=web/spec

# Generated, vendored and throwaway paths carry no signal.
sonar.exclusions=web/db/schema.rb,web/vendor/**,web/tmp/**,web/log/**,web/storage/**,web/public/assets/**

sonar.ruby.file.suffixes=.rb,.rake

# SimpleCov JSON, written by spec/spec_helper.rb and passed from the Test job
# to the SonarQube job as an artifact. This is the only coverage format the
# Ruby analyser accepts — it does not read LCOV.
sonar.ruby.coverage.reportPaths=web/coverage/coverage.json
